name = "ai-reference-gallery-stats"
main = "src/index.js"
compatibility_date = "2026-11-02"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://deeyu.github.io"

[[d1_databases]]
binding = "DB"
database_name = "ai-reference-gallery-stats"
database_id = "a0de3155-f9be-4782-a899-9d8644d41e31"

[triggers]
# 01:17 UTC = 09:17 Asia/Shanghai; 19:00 UTC cleans up stats events.
crons = ["17 1 * * *", "0 19 * * *"]
