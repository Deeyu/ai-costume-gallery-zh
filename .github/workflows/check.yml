name: 数据与代码校验
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify.py --assets
      - run: python3 scripts/portrait.py verify
      - run: python3 scripts/pose.py verify
      - run: python3 scripts/depth.py verify
      - run: node --check assets/app.js
      - run: node --check portrait/app.js && node --check portrait/catalog.js
      - run: node --check pose/app.js && node --check pose/catalog.js
      - run: node --check depth/app.js
      - run: node --test tests/test_*.js
