name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: 测试与构建
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/seo.py --check
          node --check assets/gallery-loader.js
          node --check assets/app.js
          node --check portrait/app.js
          node --check portrait/catalog.js
          node --check pose/app.js
          node --check pose/catalog.js
          node --check depth/app.js
          node --test tests/test_*.js
          python3 scripts/build.py --github-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布站点
        id: deployment
        uses: actions/deploy-pages@v4
